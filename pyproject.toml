[project]
name = "patent-law-agent"
version = "0.1.0"
description = "中国专利法知识库检索智能体"
requires-python = ">=3.11,<3.13"
dependencies = [
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=1,<2", "chromadb>=1,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.40,<2",
  "pydantic-settings>=2,<3", "httpx>=0.28,<1", "pypdf>=5,<7",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
patent-agent = "patent_agent.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/patent_agent"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
